version: 2
registries:
  jointjs-registry:
    type: npm-registry
    url: https://npm.jointjs.com
    token: ${{secrets.JOINTJS_NPM_TOKEN}}
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "direct"
    # Dependabot rebases its own PRs on package.json/yarn.lock conflicts.
    # A limit of 1 let a single open PR block all other updates.
    open-pull-requests-limit: 5
    registries:
      - jointjs-registry
    ignore:
      - dependency-name: "madge"
        update-types: ["version-update:semver-major"]
    groups:
      patternfly:
        patterns:
          - "@patternfly/*"
      jointjs:
        patterns:
          - "@joint/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      markdown-it:
        patterns:
          - "markdown-it"
          - "markdown-it-*"
          - "@types/markdown-it-*"
