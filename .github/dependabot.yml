version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "direct"
    # Dependabot rebases its own PRs on package.json/yarn.lock conflicts.
    # A limit of 1 let a single open PR block all other updates.
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "madge"
        update-types: ["version-update:semver-major"]
    groups:
      patternfly:
        patterns:
          - "@patternfly/*"
      xyflow:
        patterns:
          - "@xyflow/*"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      markdown-it:
        patterns:
          - "markdown-it"
          - "markdown-it-*"
          - "@types/markdown-it-*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
