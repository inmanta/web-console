description: A field whose suggested values depend on another, not-yet-filled field is no longer disabled: the input stays editable so free typing is always allowed, and a warning explains that suggestions are waiting on the other field, or that no suggestions are available for the current selection. Changing a source field also no longer clears the dependent fields that referenced it.
