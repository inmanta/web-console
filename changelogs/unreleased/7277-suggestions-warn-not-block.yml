description: A field whose suggested values depend on another, not-yet-filled field is no longer disabled. The input stays editable so free typing is always allowed, and a neutral hint explains that suggestions are waiting on the other field or that it has no options. Changing a source field also no longer clears the dependent fields that referenced it. A warning is shown when a kept value is no longer among the suggested values, or when the annotation is broken or the suggestions request fails.
