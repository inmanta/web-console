description: |
  The Instance Composer has a new canvas that no longer needs the licensed JointJS+ library. Cards name each instance, show its service icon, lifecycle state and what is missing, relations are drawn by dragging from a card's link action, and an Arrange action lays out complex relation trees. The palette groups services like the service catalog, and the details panel offers an instance's candidate and active attribute sets, editing only the one the composer works on.
change-type: minor
destination-branches: [master, iso9]
sections:
  feature: "{{description}}"
